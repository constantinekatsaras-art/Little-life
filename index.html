<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#282936"><title>Little Life — Prototype 001A</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#292a35;background:#282936}*{box-sizing:border-box}body{margin:0}.game{max-width:500px;margin:auto;min-height:100dvh;background:#fff5df;display:flex;flex-direction:column}.top{background:#292a35;color:white;padding:calc(env(safe-area-inset-top) + 18px) 20px 18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b8b8c3;text-transform:uppercase}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.money{font-size:31px;font-weight:800;color:#4bdf9a;font-variant-numeric:tabular-nums}.job{font-size:12px;color:#dedee5;text-align:right}.bar{height:7px;background:#4b4d5c;border-radius:9px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#ffd365;width:0}.timer{margin-top:6px;color:#c7c7d0;font-size:12px}.room{position:relative;min-height:340px;flex:1;overflow:hidden;background:repeating-linear-gradient(90deg,#ffedc1 0,#ffedc1 42px,#fff0cb 42px,#fff0cb 84px)}.wall-label{position:absolute;top:20px;left:20px;font-weight:800;color:#a58250;letter-spacing:1px}.floor{position:absolute;bottom:0;width:100%;height:24%;background:repeating-linear-gradient(0deg,#c78d57 0,#c78d57 3px,#dcaa73 3px,#dcaa73 45px);border-top:9px solid #a9784f}.bed{position:absolute;left:10%;bottom:15%;width:53%;height:145px;filter:drop-shadow(4px 8px 2px #0002)}.bed .head{position:absolute;left:3%;top:0;width:85%;height:100%;background:#a95d30;border:8px solid #87431f;border-radius:14px}.bed .pillow{position:absolute;left:15%;top:23%;width:65%;height:34%;background:#d7faff;border:4px solid #9ed7de;border-radius:22px}.bed .blanket{position:absolute;left:10%;bottom:5%;width:85%;height:49%;background:#ffd06f;border:5px solid #efb958;border-radius:20px 20px 12px 12px}.empty{position:absolute;left:10%;bottom:24%;border:2px dashed #ad916a;border-radius:12px;padding:20px;color:#987c57;background:#fff8e3a8;font-size:14px}.bottom{padding:18px 20px calc(env(safe-area-inset-bottom) + 24px);background:#fffaf0;border-top:4px solid #e3bc7c}.shop{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{font-weight:800;font-size:20px}.desc{font-size:12px;color:#77717b;margin-top:5px}.buy{border:0;border-radius:13px;padding:14px 20px;background:#2dba78;color:white;font-size:17px;font-weight:800;min-width:116px;cursor:pointer}.buy:disabled{background:#a7a6a7;color:#f3f3f3}.status{font-size:12px;color:#67636d;margin-top:15px;min-height:20px}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.small{border:1px solid #d7c5aa;background:#fff7e7;border-radius:9px;padding:8px 10px;color:#6b5b46;font-size:12px}.small:focus-visible,.buy:focus-visible{outline:3px solid #4d82c4;outline-offset:2px}
</style></head><body><main class="game"><header class="top"><div class="eyebrow">Little Life · Build 001A</div><div class="header"><div><div class="money" id="cash">£150</div><div class="eyebrow">Your cash</div></div><div class="job"><strong>Junior Employee</strong><br>£10 / 10 seconds</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="timer" id="timer" aria-live="off">Next payday in 10s</div></header><section class="room" aria-label="Your apartment"><div class="wall-label">HOME</div><div class="floor"></div><div id="empty" class="empty">Your room is empty.<br>Buy your first bed!</div><div id="bed" class="bed" role="img" aria-label="Purchased bed" hidden><div class="head"></div><div class="pillow"></div><div class="blanket"></div></div></section><section class="bottom"><div class="eyebrow" style="color:#a27c4d">Furniture shop</div><div class="shop"><div><div class="item">🛏️ Basic Bed</div><div class="desc" id="description">A place to call your own · £100</div></div><button id="buy" class="buy" type="button">Buy £100</button></div><div class="status" id="status" role="status">Welcome home. Your salary arrives automatically.</div><div class="actions"><button class="small" id="backup" type="button">Export save</button><button class="small" id="reset" type="button">Reset game</button></div></section></main>
<script>
(()=>{'use strict';
const KEY='little-life-001a-v1';const PAY_MS=10000;const SALARY=10;const PRICE=100;const MAX_OFFLINE_MS=8*60*60*1000;
const $=id=>document.getElementById(id);
const defaults=()=>({version:1,cash:150,hasBed:false,lastPaidAt:Date.now()});
function valid(s){return s&&s.version===1&&Number.isSafeInteger(s.cash)&&s.cash>=0&&typeof s.hasBed==='boolean'&&Number.isFinite(s.lastPaidAt)&&s.lastPaidAt>0;}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaults();const value=JSON.parse(raw);return valid(value)?value:defaults();}catch{return defaults();}}
let state=load();let lastSaveError=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));lastSaveError=false;}catch{lastSaveError=true;}}
function advance(now=Date.now()){const elapsed=Math.max(0,Math.min(now-state.lastPaidAt,MAX_OFFLINE_MS));const payments=Math.floor(elapsed/PAY_MS);if(payments>0){state.cash+=payments*SALARY;state.lastPaidAt=now-(elapsed%PAY_MS);save();}if(now<state.lastPaidAt)state.lastPaidAt=now;return payments;}
function render(){const remaining=PAY_MS-Math.min(PAY_MS,Math.max(0,Date.now()-state.lastPaidAt)%PAY_MS);$('cash').textContent='£'+state.cash.toLocaleString('en-GB');$('fill').style.width=((PAY_MS-remaining)/PAY_MS*100)+'%';$('timer').textContent='Next payday in '+Math.ceil(remaining/1000)+'s';$('bed').hidden=!state.hasBed;$('empty').hidden=state.hasBed;$('buy').disabled=state.hasBed||state.cash<PRICE;$('buy').textContent=state.hasBed?'Owned': 'Buy £100';$('description').textContent=state.hasBed?'Purchased and placed in your room':'A place to call your own · £100';if(lastSaveError)$('status').textContent='Warning: browser storage unavailable. Progress may not save.';}
const gained=advance();if(gained)$('status').textContent='Welcome back! Earned £'+(gained*SALARY).toLocaleString('en-GB')+' while away.';render();save();
$('buy').addEventListener('click',()=>{advance();if(state.hasBed||state.cash<PRICE){render();return;}state.cash-=PRICE;state.hasBed=true;save();$('status').textContent='Bed purchased! Your apartment is taking shape.';render();});
$('reset').addEventListener('click',()=>{if(!confirm('Reset all progress? This cannot be undone.'))return;state=defaults();save();$('status').textContent='Fresh start. Welcome home!';render();});
$('backup').addEventListener('click',()=>{advance();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='little-life-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const n=advance();if(n)$('status').textContent='Earned £'+n*SALARY+' while away.';render();}else{advance();save();}});
window.addEventListener('pagehide',()=>{advance();save();});
setInterval(()=>{advance();render();},250);
})();
</script></body></html>
